<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">이진 탐색의 원인과 결과</title>
  <desc id="desc">정렬 전제가 중간 비교를 가능하게 하고, 비교 결과가 후보 범위 제거와 다음 탐색 범위를 결정하는 인과 도식</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2f5d50"/></marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#a63d40"/></marker>
    <style>
      .bg{fill:#f5f0e6}.ink{fill:#17332f}.muted{fill:#5b706b}.card{fill:#fffdf8;stroke:#bfd0c5;stroke-width:3}.active{fill:#e8f2e7;stroke:#2f5d50;stroke-width:4}.discard{fill:#f3d8d2;stroke:#a63d40;stroke-width:3}.label{font:600 26px 'Noto Sans CJK KR',sans-serif;fill:#17332f}.small{font:22px 'Noto Sans CJK KR',sans-serif;fill:#5b706b}.num{font:700 30px ui-monospace,monospace;fill:#17332f}.branch{font:700 22px 'Noto Sans CJK KR',sans-serif;fill:#a63d40}.causal{stroke:#2f5d50;stroke-width:4;fill:none;marker-end:url(#arrow)}.reject{stroke:#a63d40;stroke-width:4;fill:none;marker-end:url(#redArrow);stroke-dasharray:10 8}.strike{stroke:#a63d40;stroke-width:7}.pointer{stroke:#e08a3e;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="860"/>
  <text class="label" x="70" y="70" font-size="40">이진 탐색: 정렬된 범위를 반씩 좁힌다</text>
  <text class="small" x="70" y="108">설명용 도식 · 화살표는 ‘조건이 다음 상태를 결정한다’는 인과 관계를 뜻함</text>

  <rect class="card" x="70" y="150" width="330" height="170" rx="18"/>
  <text class="label" x="105" y="200">1. 정렬 전제</text>
  <text class="small" x="105" y="245">2 &lt; 5 &lt; 8 &lt; 12</text>
  <text class="small" x="105" y="278">&lt; 16 &lt; 23 &lt; 38</text>
  <text class="small" x="105" y="307">순서가 있어야 절반을 버릴 수 있음</text>

  <rect class="card" x="520" y="150" width="330" height="170" rx="18"/>
  <text class="label" x="555" y="200">2. 중간 비교</text>
  <text class="small" x="555" y="245">L=0, U=6</text>
  <text class="small" x="555" y="278">mid=floor((L+U)/2)=3</text>
  <text class="small" x="555" y="307">array[3] = 12</text>

  <rect class="card" x="970" y="150" width="330" height="170" rx="18"/>
  <text class="label" x="1005" y="200">3. 조건의 결과</text>
  <text class="small" x="1005" y="245">12 &lt; 16 이므로</text>
  <text class="small" x="1005" y="278">왼쪽 0..3을 제외</text>
  <text class="small" x="1005" y="307">다음 범위는 4..6</text>

  <path class="causal" d="M400 235 H510"/><path class="causal" d="M850 235 H960"/>
  <text class="small" x="423" y="220">가능하게 함</text><text class="small" x="873" y="220">결정</text>

  <text class="label" x="70" y="405">실제 숫자에서 보이는 제거</text>
  <g transform="translate(80,450)">
    <g><rect class="discard" x="0" y="0" width="150" height="100" rx="14"/><text class="num" x="75" y="62" text-anchor="middle">2</text><path class="strike" d="M22 20 L128 80 M128 20 L22 80"/></g>
    <g><rect class="discard" x="175" y="0" width="150" height="100" rx="14"/><text class="num" x="250" y="62" text-anchor="middle">5</text><path class="strike" d="M197 20 L303 80 M303 20 L197 80"/></g>
    <g><rect class="discard" x="350" y="0" width="150" height="100" rx="14"/><text class="num" x="425" y="62" text-anchor="middle">8</text><path class="strike" d="M372 20 L478 80 M478 20 L372 80"/></g>
    <g><rect class="discard" x="525" y="0" width="150" height="100" rx="14"/><text class="num" x="600" y="62" text-anchor="middle">12</text><path class="strike" d="M547 20 L653 80 M653 20 L547 80"/></g>
    <g><rect class="active" x="700" y="0" width="150" height="100" rx="14"/><text class="num" x="775" y="62" text-anchor="middle">16</text></g>
    <g><rect class="active" x="875" y="0" width="150" height="100" rx="14"/><text class="num" x="950" y="62" text-anchor="middle">23</text></g>
    <g><rect class="active" x="1050" y="0" width="150" height="100" rx="14"/><text class="num" x="1125" y="62" text-anchor="middle">38</text></g>
    <path class="reject" d="M615 -70 C560 -35 500 -15 430 0"/>
    <text class="branch" x="250" y="150">12 &lt; target 16 → 왼쪽 절반 제거</text>
    <path class="pointer" d="M775 180 V110"/><text class="label" x="775" y="215" text-anchor="middle">남은 후보</text>
  </g>

  <rect class="card" x="70" y="690" width="600" height="115" rx="18"/>
  <text class="label" x="105" y="735">찾음: target 16</text>
  <text class="small" x="105" y="775">0..6 → 4..6 → 4..4 → array[4]=16</text>
  <rect class="card" x="730" y="690" width="600" height="115" rx="18"/>
  <text class="label" x="765" y="735">없음: target 7</text>
  <text class="small" x="765" y="775">0..6 → 0..2 → 2..2 → L=3,U=2</text>
</svg>
