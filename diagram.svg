<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Causal path from context to next-token selection</title>
  <desc id="desc">Context produces logits. Temperature-adjusted softmax produces probabilities. Top-p retains a prefix and renormalizes it. A seeded sample or greedy choice feeds back into context.</desc>
  <defs><linearGradient id="mintFlow" x1="0" x2="1"><stop stop-color="#66e3c4"/><stop offset="1" stop-color="#6faaff"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#66e3c4"/></marker><style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style></defs>
  <rect width="1120" height="420" rx="16" fill="#0b1224"/>
  <text x="562" y="65" fill="#ffc66b" font-size="13" text-anchor="middle">T = 1 · lower T sharpens · higher T flattens</text>
  <path d="M205 151H260M425 151H480M645 151H700M865 151H920" stroke="#66e3c4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1010 215V333H110V255" stroke="#6faaff" stroke-width="2.4" stroke-dasharray="7 7" marker-end="url(#arrow)" fill="none"/>
  <g transform="translate(30,92)"><rect width="175" height="118" rx="14" fill="#121b31" stroke="#66e3c4"/><text x="18" y="29" fill="#66e3c4" font-size="11" font-weight="800">CONTEXT</text><text x="18" y="58" fill="#f4f7ff" font-size="15" class="mono">The cat sat</text><text x="18" y="80" fill="#f4f7ff" font-size="15" class="mono">on the ▯</text><text x="18" y="103" fill="#a4b1ca" font-size="11">context → next logits</text></g>
  <g transform="translate(260,92)"><rect width="165" height="118" rx="14" fill="#121b31" stroke="#6faaff"/><text x="18" y="29" fill="#6faaff" font-size="11" font-weight="800">LOGITS z</text><text x="18" y="58" fill="#f4f7ff" font-size="16" class="mono">2.0  1.0  0.3</text><text x="18" y="80" fill="#f4f7ff" font-size="16" class="mono">−0.4</text><text x="18" y="103" fill="#a4b1ca" font-size="11">scores, not probabilities</text></g>
  <g transform="translate(480,92)"><rect width="165" height="118" rx="14" fill="#121b31" stroke="#ffc66b"/><text x="18" y="29" fill="#ffc66b" font-size="11" font-weight="800">SOFTMAX</text><text x="18" y="58" fill="#f4f7ff" font-size="16" class="mono">60.9%  22.4%</text><text x="18" y="80" fill="#f4f7ff" font-size="16" class="mono">11.1%  5.5%</text><text x="18" y="103" fill="#a4b1ca" font-size="11">stable exp((z−max)/T)</text></g>
  <g transform="translate(700,92)"><rect width="165" height="118" rx="14" fill="#121b31" stroke="#bc9cff"/><text x="18" y="29" fill="#bc9cff" font-size="11" font-weight="800">FILTER</text><text x="18" y="58" fill="#f4f7ff" font-size="16" class="mono">top-p = .80</text><text x="18" y="80" fill="#f4f7ff" font-size="16" class="mono">.609 + .224</text><text x="18" y="103" fill="#a4b1ca" font-size="11">keep until ≥ threshold</text></g>
  <g transform="translate(920,92)"><rect width="170" height="118" rx="14" fill="#17283a" stroke="url(#mintFlow)"/><text x="18" y="29" fill="#66e3c4" font-size="11" font-weight="800">CHOICE</text><text x="18" y="59" fill="#f4f7ff" font-size="13" class="mono">seed 42 / greedy</text><text x="18" y="82" fill="#ffc66b" font-size="16" class="mono">␠mat</text><text x="18" y="103" fill="#a4b1ca" font-size="11">one token exits</text></g>
  <text x="90" y="365" fill="#6faaff" font-size="13" font-weight="700">feedback: append chosen token, then recalculate logits</text><text x="90" y="388" fill="#6f7d99" font-size="11">This lab stops before the next forward pass. No constant-logit rollout is implied.</text>
</svg>
