<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#f7f1e5"/>
  <text x="960" y="90" text-anchor="middle" font-family="sans-serif" font-size="54" fill="#24323a">두 토큰 문맥 연결</text>
  <g font-family="sans-serif" font-size="30" fill="#24323a" stroke="#2f8f83" stroke-width="4">
    <rect x="150" y="250" width="420" height="250" rx="24" fill="#e0f0eb"/><text x="360" y="320" text-anchor="middle" stroke="none">E 조회</text><text x="360" y="390" text-anchor="middle" stroke="none">[a] [1,0]</text><text x="360" y="450" text-anchor="middle" stroke="none">[b] [0,1]</text>
    <rect x="750" y="250" width="420" height="250" rx="24" fill="#e0f0eb"/><text x="960" y="320" text-anchor="middle" stroke="none">위치별 연결</text><text x="960" y="410" text-anchor="middle" stroke="none">h = [1,0,0,1]</text><text x="960" y="460" text-anchor="middle" stroke="none">1 × 4</text>
    <rect x="1350" y="250" width="420" height="250" rx="24" fill="#ffe0b2" stroke="#db7b28"/><text x="1560" y="320" text-anchor="middle" stroke="none">W 곱하기</text><text x="1560" y="410" text-anchor="middle" stroke="none">z = [2,0,-1]</text><text x="1560" y="460" text-anchor="middle" stroke="none">4 × 3</text>
    <path d="M570 375 H750 M1170 375 H1350" fill="none" stroke="#db7b28" stroke-width="8" marker-end="url(#arrow)"/>
  </g>
  <g font-family="sans-serif" font-size="28" fill="#59656d"><text x="960" y="650" text-anchor="middle">평균은 [0.5,0.5]로 순서를 잃고, 연결은 위치 블록을 보존해요.</text><text x="960" y="715" text-anchor="middle">창 밖 토큰은 자동으로 기억되지 않아요.</text></g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#db7b28"/></marker></defs>
</svg>
