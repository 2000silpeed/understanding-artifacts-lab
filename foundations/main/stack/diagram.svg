<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">스택 LIFO 상태 변화</title><desc id="desc">10, 20, 30을 push한 뒤 30과 20을 차례로 pop하는 스택 그림</desc>
<rect width="1600" height="900" fill="#fbf8f1"/>
<text x="800" y="100" text-anchor="middle" font-family="sans-serif" font-size="58" font-weight="700" fill="#14213d">스택, 마지막 값이 먼저 나와요</text>
<g font-family="sans-serif" font-weight="700" text-anchor="middle">
<rect x="180" y="280" width="260" height="105" rx="18" fill="#effaf7" stroke="#2a9d8f" stroke-width="5"/><text x="310" y="347" font-size="42" fill="#14213d">10</text>
<rect x="470" y="280" width="260" height="105" rx="18" fill="#effaf7" stroke="#2a9d8f" stroke-width="5"/><text x="600" y="347" font-size="42" fill="#14213d">20</text>
<rect x="760" y="280" width="260" height="105" rx="18" fill="#fff0eb" stroke="#e76f51" stroke-width="6"/><text x="890" y="347" font-size="42" fill="#14213d">30</text>
<path d="M1025 332h150" stroke="#e76f51" stroke-width="8" marker-end="url(#arrow)"/><text x="1100" y="270" font-size="28" fill="#e76f51">pop</text>
<rect x="1200" y="280" width="260" height="105" rx="18" fill="#fff0eb" stroke="#e76f51" stroke-width="5"/><text x="1330" y="347" font-size="35" fill="#14213d">꺼낸 30</text>
<path d="M310 520h980" stroke="#2a9d8f" stroke-width="6"/><text x="800" y="490" font-size="34" fill="#14213d">남은 스택: 10, 20</text>
<rect x="430" y="600" width="260" height="105" rx="18" fill="#effaf7" stroke="#2a9d8f" stroke-width="5"/><text x="560" y="667" font-size="42" fill="#14213d">10</text>
<rect x="740" y="600" width="260" height="105" rx="18" fill="#fff0eb" stroke="#e76f51" stroke-width="6"/><text x="870" y="667" font-size="35" fill="#14213d">다음 pop 결과 20</text>
<text x="1200" y="650" font-size="34" fill="#14213d">다음 pop 결과 20</text>
</g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e76f51"/></marker></defs></svg>
