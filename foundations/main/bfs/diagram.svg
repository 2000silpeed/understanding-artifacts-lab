<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">BFS graph and queue layers</title><desc id="desc">Undirected graph from A to F with distances zero through three and an unreachable G.</desc><rect width="1600" height="900" fill="#f7f1e5"/><g stroke="#8b7b6b" stroke-width="8" fill="none"><path d="M260 420L560 220M260 420L560 620M560 220L900 220M560 620L900 220M560 620L900 620M900 220L1260 420M900 620L1260 420"/></g><g font-family="sans-serif" font-size="54" text-anchor="middle"><g fill="#cfe4f5" stroke="#245b8c" stroke-width="6"><circle cx="260" cy="420" r="70"/><circle cx="560" cy="220" r="70"/><circle cx="560" cy="620" r="70"/><circle cx="900" cy="220" r="70"/><circle cx="900" cy="620" r="70"/><circle cx="1260" cy="420" r="70"/></g><g fill="#17324d"><text x="260" y="438">A</text><text x="560" y="238">B</text><text x="560" y="638">C</text><text x="900" y="238">D</text><text x="900" y="638">E</text><text x="1260" y="438">F</text></g><g fill="#fff" stroke="#ad4b42" stroke-width="5"><circle cx="1460" cy="760" r="60"/></g><text x="1460" y="778" fill="#ad4b42">G</text><text x="260" y="110" fill="#17324d">거리 0</text><text x="560" y="110" fill="#17324d">거리 1</text><text x="900" y="110" fill="#17324d">거리 2</text><text x="1260" y="110" fill="#17324d">거리 3</text><text x="800" y="820" fill="#ad4b42" font-size="44">G: 도달 불가</text></g></svg>
