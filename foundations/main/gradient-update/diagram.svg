<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">첫 번째 그래디언트 업데이트</title><desc id="desc">확률에서 정답 원핫을 빼서 기울기를 구하고, 양수 학습률로 기울기를 빼서 로짓을 업데이트하는 정준 계산 예</desc><rect width="1600" height="900" fill="#fbf7ed"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#d47724"/></marker></defs><g font-family="Noto Sans CJK KR, sans-serif" text-anchor="middle" fill="#252525"><text x="800" y="72" font-size="46">확률에서 바꿀 방향 찾기</text><text x="800" y="128" font-size="25">정답 ID 1 · 학습률 0.4 · 로짓만 직접 조정하는 계산 예</text><g fill="#e4f2ef" stroke="#147d80" stroke-width="3"><rect x="70" y="220" width="290" height="260" rx="16"/><rect x="460" y="220" width="290" height="260" rx="16"/><rect x="850" y="220" width="290" height="260" rx="16"/><rect x="1240" y="220" width="290" height="260" rx="16"/></g><g font-size="30"><text x="215" y="265">원래 로짓 z</text><text x="605" y="265">확률 p</text><text x="995" y="265">기울기 p − y</text><text x="1385" y="265">새 로짓</text></g><g font-family="monospace" font-size="31"><text x="215" y="330">1.000000</text><text x="215" y="390" fill="#d47724">0.000000</text><text x="215" y="450">−0.500000</text><text x="605" y="330">0.628532</text><text x="605" y="390" fill="#d47724">0.231224</text><text x="605" y="450">0.140244</text><text x="995" y="330">0.628532</text><text x="995" y="390" fill="#d47724">−0.768776</text><text x="995" y="450">0.140244</text><text x="1385" y="330">0.748587</text><text x="1385" y="390" fill="#d47724">0.307510</text><text x="1385" y="450">−0.556098</text></g><g stroke="#d47724" stroke-width="5" marker-end="url(#arrow)"><path d="M375 350H440"/><path d="M765 350H830"/><path d="M1155 350H1220"/></g><g font-size="25"><text x="410" y="540">softmax</text><text x="800" y="540">− [0,1,0]</text><text x="1190" y="540">z − 0.4×g</text></g><text x="800" y="665" font-size="36" fill="#147d80">정답 확률 0.231224 → 0.336019</text><text x="800" y="735" font-size="36" fill="#d47724">손실 1.464369 → 1.090586</text><text x="800" y="815" font-size="25">음수 기울기를 빼면 정답 로짓이 올라가요. 값은 소수 여섯 자리 반올림이에요.</text></g></svg>
