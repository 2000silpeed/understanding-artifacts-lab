<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출력 가중치 행렬 실습</title><style>body{margin:0;background:#101827;color:#f7f1e3;font:18px system-ui,sans-serif}main{max-width:920px;margin:2rem auto;padding:1rem}section{background:#19314a;border:1px solid #42617b;border-radius:12px;padding:1rem;margin:1rem 0}button{font:inherit;padding:.65rem 1rem;border:0;border-radius:8px;background:#ffb454;color:#101827;cursor:pointer}button:focus{outline:3px solid #fff}pre{white-space:pre-wrap;line-height:1.5}output{display:block;margin-top:1rem;color:#ffb454}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}.cell{padding:.7rem;background:#243e59;border-radius:6px;text-align:center}</style></head><body><style id="companion-wrapper-style">
@font-face{font-family:NotoCourse;src:url("../assets/noto-kr.woff2") format("woff2");font-display:swap}
body{font-family:NotoCourse,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.companion-nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px;padding:8px 10px;background:#fffdf5;border:1px solid #cbc7bc;border-radius:8px}
.companion-nav a{color:#174f62}
.companion-downloads{margin-top:20px;padding:14px;border:1px solid #cbc7bc;border-radius:8px;background:#fffdf5}
.companion-downloads ul{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 0;padding-left:20px}
</style><style id="output-weight-mobile-style">main,section{box-sizing:border-box;max-width:100%}pre,output{overflow-wrap:anywhere;word-break:break-word}input{box-sizing:border-box;max-width:100%}.companion-downloads{color:#101827}</style><main><nav class="companion-nav" aria-label="실습 자료"><a href="../index.html">실험실 목록</a><span>·</span><a href="source.zip" download>전체 소스 ZIP</a></nav><h1>출력 가중치 행렬 한 걸음</h1><p>입력 h와 출력 방향 g의 바깥 곱으로 dW를 계산해요.</p><section><button id="run">계산하기</button> <button id="reveal" disabled>결과 공개</button> <button id="reset">초기화</button><output id="status" aria-live="polite">결과는 숨겨져 있어요.</output></section><section><h2>계약</h2><pre id="contract"></pre></section><section><h2>전이 예측</h2><p>W=0, h=[1,0]일 때 둘째 행은? 쉼표로 세 수를 입력하세요.</p><input id="prediction" aria-label="둘째 행 예측" placeholder="예: 1,2,3"><button id="predict">예측 확인</button><output id="feedback" aria-live="polite"></output></section><section><h2>dW (공개 후)</h2><div id="dw" class="grid"></div></section><section id="answer" hidden><h2>업데이트 결과</h2><pre id="result"></pre></section><section class="companion-downloads" aria-label="다운로드"><h2>실행 자료 내려받기</h2><ul>
<li><a href="canonical.py" download>Python canonical.py</a></li>
<li><a href="canonical.cpp" download>C++17 canonical.cpp</a></li>
<li><a href="expected.txt" download>expected.txt</a></li>
<li><a href="diagram.svg" download>diagram.svg</a></li>
<li><a href="source.zip" download>source.zip</a></li>
</ul></section></main><script type="module">import {TRACE,fmt} from './trace-shared.js';import {makeLab} from './practice.js';const lab=makeLab(),$=id=>document.getElementById(id),render=()=>{$('contract').textContent=`h = [${TRACE.h.join(', ')}], target = ${TRACE.targetId}, learning rate = ${TRACE.learningRate}`;$('dw').innerHTML=(lab.state().revealed?lab.state().result.dW.flat():[]).map(v=>`<div class="cell">${fmt(v)}</div>`).join('');$('answer').hidden=!lab.state().revealed;$('reveal').disabled=!lab.state().result;if(lab.state().revealed){const r=lab.state().result;$('result').textContent=`z = [${r.z.map(fmt)}]\np = [${r.p.map(fmt)}]\ng = [${r.g.map(fmt)}]\nW′ = ${JSON.stringify(r.next)}\np′ = [${r.pPrime.map(fmt)}]\n손실 = ${fmt(r.loss)} → ${fmt(r.lossPrime)}`;}};$('predict').onclick=()=>{const v=$('prediction').value.split(',').map(Number);$('feedback').textContent=v.length===3&&v.every(x=>x===0)?'맞아요. 둘째 입력 0을 각 g에 곱하므로 모두 0이에요.':'둘째 입력 0 × g를 각 칸에 적용해 보세요.'};$('run').onclick=()=>{lab.run();$('status').textContent='계산했어요. 잠시 예측한 뒤 결과를 공개하세요.';render()};$('reveal').onclick=()=>{lab.reveal();$('status').textContent='결과를 공개했어요.';render()};$('reset').onclick=()=>{lab.reset();$('status').textContent='결과는 숨겨져 있어요.';render()};render();</script></body></html>
