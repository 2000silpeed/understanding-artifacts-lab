<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">입력과 출력 가중치의 바깥 곱</title><desc id="desc">입력 h의 두 성분과 출력 방향 g의 세 성분을 곱해 2 곱하기 3 가중치 기울기를 만든다.</desc><rect width="1200" height="700" fill="#101827"/><g font-family="sans-serif" fill="#f7f1e3"><text x="70" y="70" font-size="38">dW = h ⊗ g</text><text x="90" y="170" font-size="30" fill="#ffb454">h</text><text x="90" y="295" font-size="28">1</text><text x="90" y="415" font-size="28">2</text><text x="390" y="120" font-size="30" fill="#ffb454">g</text><g font-size="25"><text x="390" y="180">1/3</text><text x="570" y="180">1/3</text><text x="750" y="180">−2/3</text></g><g stroke="#ffb454" stroke-width="3" fill="#19314a"><rect x="350" y="240" width="180" height="90"/><rect x="550" y="240" width="180" height="90"/><rect x="750" y="240" width="180" height="90"/><rect x="350" y="360" width="180" height="90"/><rect x="550" y="360" width="180" height="90"/><rect x="750" y="360" width="180" height="90"/></g><g font-size="26" text-anchor="middle"><text x="440" y="295">1/3</text><text x="640" y="295">1/3</text><text x="840" y="295">−2/3</text><text x="440" y="415">2/3</text><text x="640" y="415">2/3</text><text x="840" y="415">−4/3</text></g><text x="350" y="540" font-size="30">첫째 행 = 1 × g, 둘째 행 = 2 × g</text><text x="350" y="610" font-size="25" fill="#ffb454">입력 성분이 큰 행이 더 크게 움직인다</text></g></svg>
