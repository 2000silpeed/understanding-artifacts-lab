<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서로소 집합 실습</title>
<style>
:root{color-scheme:light;--paper:#f7f1e5;--ink:#1f2933;--blue:#2d6cdf;--accent:#d94f70;--line:#c6bcae}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.6}main{max-width:1000px;margin:0 auto;padding:28px 20px 56px}h1{font-size:clamp(30px,5vw,54px);line-height:1.1;margin:0 0 8px}.lede{font-size:19px}.card{background:#fffaf1;border:2px solid var(--line);border-radius:18px;padding:18px;margin:18px 0;box-shadow:4px 4px 0 #ded3c4}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,input{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:10px 14px;font-size:16px}button{cursor:pointer}button:hover,button:focus{background:#ffe2e9}.forest{font:700 17px ui-monospace,monospace;white-space:pre-wrap;background:#18212b;color:#f7f1e5;border-radius:12px;padding:16px;min-height:70px}.event{font-family:ui-monospace,monospace}.muted{color:#5d6870}.answer{min-height:2em;color:var(--accent);font-weight:700}.status{font-weight:700;color:var(--blue)}
</style>
<style id="trie-companion-font-wrapper">@font-face{font-family:NotoCourse;src:url("../assets/noto-kr.woff2") format("woff2");font-display:swap}body{font-family:NotoCourse,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}main,section{box-sizing:border-box;max-width:100%}.trie{box-sizing:border-box;max-width:100%;overflow-wrap:anywhere;word-break:break-word}pre{overflow-wrap:anywhere;word-break:break-word}</style></head>
<body>
<main>
<h1>서로소 집합</h1>
<p class="lede">parent와 root로 같은 그룹을 확인하고, union과 find를 직접 실행해요.</p>
<section class="card"><h2>canonical trace</h2><div id="forest" class="forest" aria-live="polite"></div><p id="event" class="event"></p><div class="row"><button id="advance" type="button">다음 event</button><button id="reset" type="button">처음으로</button></div></section>
<section class="card"><h2>직접 union 실행</h2><p>영부터 오까지의 ID만 허용해요. 음수와 범위 밖 입력은 거절해요.</p><label for="union-a">a</label><input id="union-a" inputmode="numeric" value="4"><label for="union-b">b</label><input id="union-b" inputmode="numeric" value="5"><button id="apply-union" type="button">union 실행</button><p id="status" class="status" aria-live="polite"></p></section>
<section class="card"><h2>예측하기</h2><p>정본 예제의 완료 상태 parent=[0,0,0,0,4,5]에서 same(0,4)를 예측해 보세요. 이 질문은 위 직접 실행 상태와 별도예요.</p><select id="prediction"><option value="">선택하세요</option><option value="true">true</option><option value="false">false</option></select><button id="save" type="button">예측 저장</button><button id="reveal" type="button">정답 공개</button><p id="answer" class="answer" aria-live="polite"></p></section>
<section class="card"><h2>전이</h2><p id="transfer" class="muted"></p></section>
<footer class="companion-downloads" aria-label="다운로드"><a href="source.zip" download>전체 소스 ZIP 내려받기</a></footer></main>
<script id="canonical-trace" type="application/json">{"canonical":{"input":[0,1,2,3,4,5],"initial":{"parent":[0,1,2,3,4,5],"size":[1,1,1,1,1,1]},"unions":[{"accepted":true,"changed":true,"root":0},{"accepted":true,"changed":true,"root":2},{"accepted":true,"changed":true,"root":0}],"find_3_path_before":[3,2,0],"find_3_path_after":[3,0],"queries":{"same_0_3":{"accepted":true,"result":true},"same_0_4":{"accepted":true,"result":false}},"duplicate_union_0_3":{"accepted":true,"changed":false,"root":0},"events":[{"operation":"union","a":0,"b":1,"result":"merged","roots":[0,1],"changed":true,"path_before":[[0],[1]],"path_after":[[0],[1,0]],"snapshot":{"parent":[0,0,2,3,4,5],"size":[2,1,1,1,1,1]}},{"operation":"union","a":2,"b":3,"result":"merged","roots":[2,3],"changed":true,"path_before":[[2],[3]],"path_after":[[2],[3,2]],"snapshot":{"parent":[0,0,2,2,4,5],"size":[2,1,2,1,1,1]}},{"operation":"union","a":1,"b":2,"result":"merged","roots":[0,2],"changed":true,"path_before":[[1,0],[2]],"path_after":[[1,0],[2,0]],"snapshot":{"parent":[0,0,0,2,4,5],"size":[4,1,2,1,1,1]}},{"operation":"find","a":3,"b":null,"result":"root","roots":[0],"changed":true,"path_before":[[3,2,0]],"path_after":[[3,0]],"snapshot":{"parent":[0,0,0,0,4,5],"size":[4,1,2,1,1,1]}},{"operation":"same","a":0,"b":3,"result":"true","roots":[0,0],"changed":false,"path_before":[[0],[3,0]],"path_after":[[0],[3,0]],"snapshot":{"parent":[0,0,0,0,4,5],"size":[4,1,2,1,1,1]}},{"operation":"same","a":0,"b":4,"result":"false","roots":[0,4],"changed":false,"path_before":[[0],[4]],"path_after":[[0],[4]],"snapshot":{"parent":[0,0,0,0,4,5],"size":[4,1,2,1,1,1]}},{"operation":"union","a":0,"b":3,"result":"already_same","roots":[0,0],"changed":false,"path_before":[[0],[3,0]],"path_after":[[0],[3,0]],"snapshot":{"parent":[0,0,0,0,4,5],"size":[4,1,2,1,1,1]}}],"final":{"parent":[0,0,0,0,4,5],"size":[4,1,2,1,1,1]}},"edge":{"n_zero":{"union_0_0":{"accepted":false,"reason":"out_of_range","changed":false},"same_0_0":{"accepted":false,"reason":"out_of_range","result":false},"negative_find":null,"events":[{"operation":"union","a":0,"b":0,"result":"out_of_range","roots":[],"changed":false,"path_before":[],"path_after":[],"snapshot":{"parent":[],"size":[]}},{"operation":"same","a":0,"b":0,"result":"out_of_range","roots":[],"changed":false,"path_before":[],"path_after":[],"snapshot":{"parent":[],"size":[]}},{"operation":"find","a":-1,"b":null,"result":"negative_id","roots":[],"changed":false,"path_before":[],"path_after":[],"snapshot":{"parent":[],"size":[]}}],"final":{"parent":[],"size":[]}},"n_one":{"union_0_0":{"accepted":true,"changed":false,"root":0},"same_0_0":{"accepted":true,"result":true},"out_of_range_union":{"accepted":false,"reason":"out_of_range","changed":false},"events":[{"operation":"union","a":0,"b":0,"result":"already_same","roots":[0,0],"changed":false,"path_before":[[0],[0]],"path_after":[[0],[0]],"snapshot":{"parent":[0],"size":[1]}},{"operation":"same","a":0,"b":0,"result":"true","roots":[0,0],"changed":false,"path_before":[[0],[0]],"path_after":[[0],[0]],"snapshot":{"parent":[0],"size":[1]}},{"operation":"union","a":0,"b":1,"result":"out_of_range","roots":[],"changed":false,"path_before":[],"path_after":[],"snapshot":{"parent":[0],"size":[1]}}],"final":{"parent":[0],"size":[1]}}},"transfer":{"after_union_4_5_same_0_5":{"accepted":true,"result":false},"union_3_5":{"accepted":true,"changed":true,"root":0},"after_union_3_5_same_0_5":{"accepted":true,"result":true},"final":{"parent":[0,0,0,0,0,0],"size":[6,1,2,1,2,1]},"events":[{"operation":"union","a":0,"b":1,"result":"merged","roots":[0,1],"changed":true,"path_before":[[0],[1]],"path_after":[[0],[1,0]],"snapshot":{"parent":[0,0,2,3,4,5],"size":[2,1,1,1,1,1]}},{"operation":"union","a":2,"b":3,"result":"merged","roots":[2,3],"changed":true,"path_before":[[2],[3]],"path_after":[[2],[3,2]],"snapshot":{"parent":[0,0,2,2,4,5],"size":[2,1,2,1,1,1]}},{"operation":"union","a":1,"b":2,"result":"merged","roots":[0,2],"changed":true,"path_before":[[1,0],[2]],"path_after":[[1,0],[2,0]],"snapshot":{"parent":[0,0,0,2,4,5],"size":[4,1,2,1,1,1]}},{"operation":"union","a":4,"b":5,"result":"merged","roots":[4,5],"changed":true,"path_before":[[4],[5]],"path_after":[[4],[5,4]],"snapshot":{"parent":[0,0,0,2,4,4],"size":[4,1,2,1,2,1]}},{"operation":"same","a":0,"b":5,"result":"false","roots":[0,4],"changed":false,"path_before":[[0],[5,4]],"path_after":[[0],[5,4]],"snapshot":{"parent":[0,0,0,2,4,4],"size":[4,1,2,1,2,1]}},{"operation":"union","a":3,"b":5,"result":"merged","roots":[0,4],"changed":true,"path_before":[[3,2,0],[5,4]],"path_after":[[3,0],[5,4,0]],"snapshot":{"parent":[0,0,0,0,0,4],"size":[6,1,2,1,2,1]}},{"operation":"same","a":0,"b":5,"result":"true","roots":[0,0],"changed":true,"path_before":[[0],[5,4,0]],"path_after":[[0],[5,0]],"snapshot":{"parent":[0,0,0,0,0,0],"size":[6,1,2,1,2,1]}}]}}</script>
<script>
(() => {
  const trace = JSON.parse(document.getElementById('canonical-trace').textContent);
  const events = trace.canonical.events;
  const expected = trace.canonical.queries.same_0_4.result;
  const n = 6;
  let index = -1;
  let saved = null;
  let parent = Array.from({length:n}, (_, i) => i);
  let size = Array.from({length:n}, () => 1);
  const forest = document.getElementById('forest');
  const event = document.getElementById('event');
  const answer = document.getElementById('answer');
  const prediction = document.getElementById('prediction');
  const renderLive = () => { forest.textContent = JSON.stringify({parent, size}); };
  const renderEvent = () => { if (index < 0) { event.textContent = '초기 상태 · 다음 event를 눌러 첫 합치기를 실행해요.'; return; } const e = events[index]; event.textContent = `${index + 1}번째 event · ${e.operation}(${e.a}${e.b === null ? '' : ',' + e.b}) · ${e.result}`; };
  const render = () => { renderLive(); renderEvent(); };
  const valid = (x) => Number.isInteger(x) && x >= 0 && x < n;
  const find = (x) => { let root = x; while (parent[root] !== root) root = parent[root]; while (parent[x] !== x) { const next = parent[x]; parent[x] = root; x = next; } return root; };
  document.getElementById('advance').addEventListener('click', () => { index = Math.min(index + 1, events.length - 1); document.getElementById('advance').disabled = index === events.length - 1; parent = events[index].snapshot.parent.slice(); size = events[index].snapshot.size.slice(); render(); });
  document.getElementById('reset').addEventListener('click', () => { index = -1; document.getElementById('advance').disabled = false; saved = null; prediction.value = ''; answer.textContent = ''; parent = Array.from({length:n}, (_, i) => i); size = Array.from({length:n}, () => 1); document.getElementById('status').textContent = '초기 parent와 size로 돌아왔어요.'; render(); });
  document.getElementById('apply-union').addEventListener('click', () => { const rawA = document.getElementById('union-a').value.trim(); const rawB = document.getElementById('union-b').value.trim(); const a = rawA === '' ? NaN : Number(rawA); const b = rawB === '' ? NaN : Number(rawB); if (!valid(a) || !valid(b)) { document.getElementById('status').textContent = 'ID는 영부터 오까지의 정수여야 해요.'; return; } let ra = find(a); let rb = find(b); if (ra === rb) { document.getElementById('status').textContent = '이미 같은 root라서 변화가 없어요.'; return; } if (size[ra] < size[rb] || (size[ra] === size[rb] && rb < ra)) [ra, rb] = [rb, ra]; parent[rb] = ra; size[ra] += size[rb]; document.getElementById('status').textContent = `root ${ra}가 ${rb}를 붙였어요. size=${size[ra]}`; renderLive(); event.textContent = '직접 실행 결과 · trace 재생과 별도'; });
  document.getElementById('save').addEventListener('click', () => { if (prediction.value === '') { saved = null; answer.textContent = '먼저 예측을 선택해 주세요.'; return; } saved = prediction.value === 'true'; answer.textContent = `내 예측 ${saved}을 저장했어요. 정답 공개 전에는 답을 숨겨요.`; });
  document.getElementById('reveal').addEventListener('click', () => { if (saved === null) { answer.textContent = '먼저 예측 저장을 눌러 주세요.'; return; } answer.textContent = `정답: ${expected}. ${saved === expected ? '맞았어요.' : 'trace의 root를 다시 확인해 보세요.'}`; });
  document.getElementById('transfer').textContent = `전이: union(4,5) 뒤 same(0,5) ${trace.transfer.after_union_4_5_same_0_5.result}, union(3,5) 뒤 ${trace.transfer.after_union_3_5_same_0_5.result}`;
  render();
})();
</script>
</body>
</html>
