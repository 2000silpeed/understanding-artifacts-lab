<script>
const trace=JSON.parse(document.getElementById('canonical-trace').textContent);
const events=trace.canonical.events;
const append=events.findIndex(e=>e.kind==='push_append'&&e.value===3);
const steps=events.slice(append).filter(e=>['push_append','push_swap','pop_move_last','pop_swap'].includes(e.kind));
const states=[['push(3) 뒤 루트는?',trace.canonical.initial_heap[0]],['처음 비교할 부모 인덱스와 값은? (배열 입력)',[events[append+1].parent,steps[0].heap[2]]],['pop_min() 반환값은?',trace.canonical.pop_min],['pop 뒤 배열은?',trace.canonical.after_pop],['[1,2,3]에서 pop 뒤 배열은?',trace.edges.left_only.after_pop]];
let i=0,shown=false,prediction=null,step=0;
function render(){document.querySelector('#question').textContent='입력 '+JSON.stringify(trace.canonical.input)+' · '+states[i][0];document.querySelector('#answer').textContent=shown?'내 예측: '+JSON.stringify(prediction)+' / 정답: '+JSON.stringify(states[i][1])+' / '+(JSON.stringify(prediction)===JSON.stringify(states[i][1])?'맞았어요':'부모와 자식을 다시 확인해요'):'정답은 숨겨져 있어요.';document.querySelector('#trace').textContent=shown?JSON.stringify({kind:steps[step].kind,heap:steps[step].heap,index:steps[step].index,parent:steps[step].parent,child:steps[step].child},null,2):'예측 후 공개하면 실행 이벤트를 한 상태씩 볼 수 있어요.';}
document.querySelector('#predict').onclick=()=>{try{prediction=JSON.parse(document.querySelector('#input').value);shown=false;render()}catch{document.querySelector('#answer').textContent='숫자 또는 [2,7] 같은 배열로 입력하세요.'}};
document.querySelector('#reveal').onclick=()=>{shown=true;render()};
document.querySelector('#advance').onclick=()=>{if(!shown)return;i=Math.min(i+1,states.length-1);shown=false;prediction=null;render()};
document.querySelector('#reset').onclick=()=>{i=0;shown=false;prediction=null;step=0;render()};
const next=document.createElement('button');next.textContent='다음 trace 이벤트';next.onclick=()=>{if(shown){step=(step+1)%steps.length;render()}};document.querySelector('#trace').before(next);render();
</script>
