<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Logit에서 stable softmax까지</title>
  <desc id="desc">공개 임베딩 벡터와 손으로 고른 가중치 행렬이 logits가 되고, 최대값을 뺀 뒤 양수 weight와 확률로 정규화되는 도식</desc>
  <rect width="1600" height="900" fill="#fbf7ed"/>
  <text x="800" y="86" text-anchor="middle" font-family="sans-serif" font-size="54" font-weight="700" fill="#252525">logit → stable softmax</text>
  <g font-family="monospace" font-size="30" text-anchor="middle">
    <rect x="90" y="220" width="250" height="120" rx="18" fill="#e4f2ef" stroke="#147d80" stroke-width="4"/>
    <text x="215" y="270" fill="#147d80">embedding</text><text x="215" y="315" fill="#252525">[0, 2]</text>
    <rect x="425" y="165" width="330" height="230" rx="18" fill="#fffdf8" stroke="#147d80" stroke-width="4"/>
    <text x="590" y="215" fill="#147d80">W, shape 2×3</text>
    <text x="590" y="270" fill="#252525">[1, 0, −1]</text><text x="590" y="325" fill="#252525">[0, 1,  2]</text>
    <rect x="840" y="220" width="260" height="120" rx="18" fill="#ffe4b8" stroke="#d47724" stroke-width="4"/>
    <text x="970" y="270" fill="#d47724">logits</text><text x="970" y="315" fill="#252525">[0, 2, 4]</text>
    <path d="M350 280H410M765 280H825" stroke="#d47724" stroke-width="8" marker-end="url(#arrow)"/>
  </g>
  <g font-family="sans-serif" font-size="28" fill="#252525">
    <text x="120" y="500">max subtraction</text><text x="120" y="545">[−4, −2, 0]</text>
    <text x="520" y="500">exp → positive weights</text><text x="520" y="545">[0.018316, 0.135335, 1.000000]</text>
    <text x="520" y="585">누적 합: 0.018316 → 0.153651 → 1.153651</text>
    <text x="1180" y="500">divide by denominator</text><text x="1180" y="545">1.153651</text>
  </g>
  <g transform="translate(120 620)" font-family="monospace" font-size="26">
    <text x="0" y="0" fill="#147d80">probabilities</text>
    <rect x="0" y="35" width="280" height="42" rx="8" fill="#147d80"/><text x="300" y="67" fill="#252525">0.015876</text>
    <rect x="0" y="100" width="420" height="42" rx="8" fill="#147d80"/><text x="440" y="132" fill="#252525">0.117310</text>
    <rect x="0" y="165" width="1000" height="42" rx="8" fill="#d47724"/><text x="1020" y="197" fill="#252525">0.866813 → prediction class 2</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d47724"/></marker></defs>
</svg>
