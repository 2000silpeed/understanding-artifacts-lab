<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학습률 실습</title><link rel="stylesheet" href="style.css"></head><body><main><p>AI 기본기 연구실 · 학습 동반 실습</p><h1>학습률: 같은 기울기로 얼마나 크게 움직일까?</h1><p>같은 모델의 한 걸음을 먼저 예상하고, 실제 갱신과 손실을 확인해 보세요.</p><nav><a href="lesson.html">수업 노트 읽기</a><a href="lesson.md" download>원본 Markdown 받기</a><a href="source.zip" download>학습자 소스 ZIP 받기</a></nav><section class="card"><h2>한 걸음 예상하기</h2><p>데이터와 학습률을 고르고 다음 점수 z를 예상하세요. 정답을 입력하지 않아도 확인할 수 있습니다.</p><label for="fixture">입력 데이터</label><select id="fixture"><option value="input">점심은: 김밥 6 · 라면 2</option><option value="practice">아침은: 토스트 9 · 죽 1</option></select><label for="rate">학습률</label><select id="rate"></select><p id="operands"></p><label for="prediction">다음 z 예상 (선택)</label><input id="prediction" type="number" step="any" placeholder="예: 0.5"><div><button id="reveal">계산 확인</button><button id="back">이전 걸음</button><button id="next" disabled>다음 걸음</button><button id="reset">처음부터</button></div><div id="result" hidden aria-live="polite"></div></section><p class="muted">이 실습은 수업의 장난감 모델을 사용합니다. 바닥 근처의 경계는 근사이며 실제 모델의 권장 학습률이 아닙니다.</p></main><script src="fixtures.js"></script><script src="math.js"></script><script src="app.js"></script></body></html>
