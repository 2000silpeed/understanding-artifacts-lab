<script>
(() => {
  const trace = JSON.parse(document.getElementById('canonical-trace').textContent);
  const events = trace.canonical.events;
  const expected = trace.canonical.queries[1].result;
  let index = 0;
  let saved = null;
  const trie = document.getElementById('trie');
  const event = document.getElementById('event');
  const answer = document.getElementById('answer');
  const prediction = document.getElementById('prediction');
  const render = () => { const e = events[index]; trie.textContent = JSON.stringify(e.snapshot); event.textContent = `${index + 1}번째 event · ${e.operation}(${e.word}) · ${e.action} · ${e.result}`; };
  document.getElementById('advance').addEventListener('click', () => { index = (index + 1) % events.length; render(); });
  document.getElementById('reset').addEventListener('click', () => { index = 0; saved = null; prediction.value = ''; answer.textContent = ''; render(); });
  document.getElementById('save').addEventListener('click', () => { if (prediction.value === '') { saved = null; answer.textContent = '먼저 예측을 선택해 주세요.'; return; } saved = prediction.value === 'true'; answer.textContent = `내 예측 ${saved}을 저장했어요. 정답 공개 전에는 답을 숨겨요.`; });
  document.getElementById('reveal').addEventListener('click', () => { if (saved === null) { answer.textContent = '먼저 예측 저장을 눌러 주세요.'; return; } answer.textContent = `정답: ${expected}. ${saved === expected ? '맞았어요.' : '다시 terminal을 확인해 보세요.'}`; });
  document.getElementById('transfer').textContent = `전이: 삽입 전 exact do ${trace.transfer.before.exact_do.result}, prefix do ${trace.transfer.before.prefix_do.result} → 삽입 후 exact do ${trace.transfer.after.exact_do.result}, exact dog ${trace.transfer.after.exact_dog.result}`;
  render();
})();
</script>
