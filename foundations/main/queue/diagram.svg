<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">큐 FIFO 상태 변화</title><desc id="desc">12, 35, 8에 47을 넣고 앞의 12를 제거한 뒤 35, 8, 47이 남는 큐 그림</desc>
<rect width="1600" height="900" fill="#fbf8f1"/>
<text x="800" y="88" text-anchor="middle" font-family="sans-serif" font-size="58" font-weight="700" fill="#14213d">큐, 먼저 온 값이 먼저 나와요</text>
<g font-family="sans-serif" font-weight="700" text-anchor="middle">
<text x="150" y="240" font-size="34" fill="#e76f51">앞</text><text x="1450" y="240" font-size="34" fill="#2a9d8f">뒤</text>
<rect x="100" y="285" width="250" height="108" rx="18" fill="#fff0eb" stroke="#e76f51" stroke-width="6"/><text x="225" y="354" font-size="44" fill="#14213d">12</text>
<rect x="390" y="285" width="250" height="108" rx="18" fill="#effaf7" stroke="#2a9d8f" stroke-width="5"/><text x="515" y="354" font-size="44" fill="#14213d">35</text>
<rect x="680" y="285" width="250" height="108" rx="18" fill="#effaf7" stroke="#2a9d8f" stroke-width="5"/><text x="805" y="354" font-size="44" fill="#14213d">8</text>
<rect x="970" y="285" width="250" height="108" rx="18" fill="#fff0eb" stroke="#e76f51" stroke-width="6"/><text x="1095" y="354" font-size="44" fill="#14213d">47</text>
<path d="M1250 339h210" stroke="#2a9d8f" stroke-width="7" marker-end="url(#arrow)"/><text x="800" y="225" font-size="34" fill="#14213d">논리 순서: 12 → 35 → 8 → 47</text>
<path d="M225 420v105" stroke="#e76f51" stroke-width="8" marker-end="url(#arrowHot)"/><text x="225" y="575" font-size="34" fill="#e76f51">dequeue 12</text>
<rect x="300" y="650" width="250" height="108" rx="18" fill="#fff0eb" stroke="#e76f51" stroke-width="6"/><text x="425" y="719" font-size="39" fill="#14213d">35</text>
<rect x="590" y="650" width="250" height="108" rx="18" fill="#effaf7" stroke="#2a9d8f" stroke-width="5"/><text x="715" y="719" font-size="39" fill="#14213d">8</text>
<rect x="880" y="650" width="250" height="108" rx="18" fill="#effaf7" stroke="#2a9d8f" stroke-width="5"/><text x="1005" y="719" font-size="39" fill="#14213d">47</text>
<text x="1290" y="705" font-size="33" fill="#14213d">남은 상태</text><text x="1290" y="750" font-size="35" fill="#2a9d8f">[35, 8, 47]</text>
</g>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2a9d8f"/></marker><marker id="arrowHot" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e76f51"/></marker></defs>
</svg>
